# Use Android Studio's bundled JDK instead of Java 25
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr

# Memory settings — tuned for 16GB machines that also run an IDE +
# antivirus + browser concurrently with the build. The previous
# config (-Xmx4096m + MaxMetaspaceSize=2048m) caused a native OOM
# crash because the daemon alone wanted ~7GB. We bring the heap
# down to 1.5GB and metaspace to 512MB so the daemon, Kotlin
# worker, and Dart frontend can all fit alongside the IDE.
#
# G1's string dedup + ReservedCodeCacheSize cap keep native (off-
# heap) memory bounded so Windows doesn't fail to commit pages.
#
# The `-Djavax.net.ssl.trustStore=...` flag points Java at a
# project-local copy of `cacerts` that includes the Avast
# "Web/Mail Shield Root" certificate. Required on this machine
# because Avast Antivirus does TLS interception — it re-signs every
# HTTPS response with a private root CA. Windows trusts that root
# (Avast installed it) but the JDK didn't, which caused every
# Gradle dependency download to fail with PKIX path errors. We
# can't modify the JDK's own `cacerts` without admin rights, so
# the local copy is the friction-free fix. See `cacerts.local` in
# this folder — refresh it via `keytool -importcert ...` if Avast
# ever rotates its root.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=240m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -XX:+UseStringDeduplication -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStore=cacerts.local -Djavax.net.ssl.trustStorePassword=changeit --enable-native-access=ALL-UNNAMED

# AndroidX only — we don't use any android.support.* libraries.
# Disabling jetifier saves a meaningful amount of build-time memory
# (it streams every transitive .jar through an ASM transformer).
android.useAndroidX=true
android.enableJetifier=false

# Performance optimizations.
#
# - parallel=false: parallel project execution spawns extra worker
#   processes that each grab their own heap; on a memory-tight box
#   this is exactly what triggers native OOM during Kotlin compile.
# - caching/configuration-cache: speed up incremental builds without
#   any extra RAM cost.
# - workers.max=2: hard-cap the number of concurrent Gradle workers
#   so a single project build can't fork dozens of compile/lint
#   processes at once.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.workers.max=2
org.gradle.vfs.watch=true

# Run Kotlin compiles in a separate, smaller daemon instead of in
# the main Gradle daemon — this is the single biggest factor for
# preventing native OOM on small machines, since the Kotlin worker
# gets its own heap and is GC'd between builds.
kotlin.incremental=true
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=160m -XX:+UseG1GC